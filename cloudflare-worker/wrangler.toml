name = "openviz-ai-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Environment variables (set via `wrangler secret put GROQ_API_KEY`)
# Never commit actual secrets to this file

[vars]
ALLOWED_ORIGIN = "http://localhost:5173"
RATE_LIMIT_REQUESTS = "100"
RATE_LIMIT_WINDOW_HOURS = "1"

# Production environment
[env.production]
vars = { ALLOWED_ORIGIN = "https://your-production-domain.com" }

# KV namespace for rate limiting (create via `wrangler kv:namespace create RATE_LIMIT`)
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "your-kv-namespace-id"
